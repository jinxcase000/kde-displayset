# kde-displayset example config
# -----------------------------------------------------------------------
# Copy this file to ~/.config/kde-displayset/<appname>.conf
# Then launch your app with: kds-launch <appname>
#
# Example:
#   cp example.conf ~/.config/kde-displayset/stalker2.conf
#   kds-launch stalker2
#
# Use --dry-run to test without applying changes or launching:
#   kds-launch stalker2 --dry-run
# -----------------------------------------------------------------------


# -----------------------------------------------------------------------
# ENTRY_HDR — HDR state to apply when the app launches
#
#   on          Enable HDR
#   off         Disable HDR
#   passthrough Leave HDR exactly as it is (do nothing)
#
# Default if omitted: passthrough
# -----------------------------------------------------------------------
ENTRY_HDR="on"


# -----------------------------------------------------------------------
# ENTRY_VRR — Adaptive Sync (VRR/G-Sync/FreeSync) state on launch
#
#   on          Enable VRR (sets KWin VRR mode to "Always")
#   off         Disable VRR
#   passthrough Leave VRR exactly as it is
#
# Default if omitted: passthrough
# -----------------------------------------------------------------------
ENTRY_VRR="on"


# -----------------------------------------------------------------------
# EXIT_HDR — HDR state to apply when the app closes
#
#   on          Enable HDR on exit
#   off         Disable HDR on exit
#   restore     Restore HDR to whatever it was BEFORE the app launched
#
# Default if omitted: restore
# -----------------------------------------------------------------------
EXIT_HDR="restore"


# -----------------------------------------------------------------------
# EXIT_VRR — Adaptive Sync state when the app closes
#
#   on          Enable VRR on exit
#   off         Disable VRR on exit
#   restore     Restore VRR to whatever it was BEFORE the app launched
#
# Default if omitted: restore
# -----------------------------------------------------------------------
EXIT_VRR="restore"


# -----------------------------------------------------------------------
# COMMAND — the full command to launch your app
#
# This is passed to bash eval, so environment variables, flags, and
# quoted arguments all work as expected.
#
# Steam game example (replace 12345 with your actual Steam AppID):
#   COMMAND="steam steam://rungameid/12345"
#
# Direct binary with flags:
#   COMMAND="/usr/bin/mpv --fullscreen /path/to/movie.mkv"
#
# With Steam launch options already set in Steam itself:
#   COMMAND="steam steam://rungameid/1643380"
#
# -----------------------------------------------------------------------
COMMAND="steam steam://rungameid/12345"
