# kde-displayset example config
# -----------------------------------------------------------------------
# Copy this file to ~/.config/kde-displayset/<appname>.conf
#
# Standalone app:    kds-launch <appname>
# Steam/Heroic:      add  kds-launch %command%  to launch options
# Force a config:    add  kds-launch=appname %command%  to launch options
#
# Test without applying anything:
#   kds-launch <appname> --dry-run
# -----------------------------------------------------------------------


# -----------------------------------------------------------------------
# NAME — Human readable name, shown in --list output
# Optional. If omitted, the filename is used instead.
# -----------------------------------------------------------------------
NAME="My App"


# -----------------------------------------------------------------------
# LAUNCHER — The launcher type for auto-detection
#
#   steam     Matched against the SteamAppId environment variable
#   heroic    Matched against the HEROIC_APP_NAME environment variable
#   none      No auto-detection (standalone apps, always called by name)
#
# Optional. If omitted, auto-detection falls back to filename matching only.
# -----------------------------------------------------------------------
LAUNCHER="steam"


# -----------------------------------------------------------------------
# LAUNCHER_ID — The app/game ID for the launcher above
#
#   steam     Steam AppID (e.g. 1643380 for STALKER 2)
#   heroic    Heroic app name string
#
# Optional if using filename-based detection (e.g. file named 1643380.conf).
# Required if LAUNCHER is set and you want field-based detection.
# -----------------------------------------------------------------------
LAUNCHER_ID="12345"


# -----------------------------------------------------------------------
# ENTRY_HDR — HDR state to apply when the app launches
#
#   on          Enable HDR
#   off         Disable HDR
#   passthrough Leave HDR exactly as it is
#
# Default if omitted: passthrough
# -----------------------------------------------------------------------
ENTRY_HDR="on"


# -----------------------------------------------------------------------
# ENTRY_VRR — Adaptive Sync (VRR/G-Sync/FreeSync) state on launch
#
#   on          Enable VRR (sets KWin to Always mode)
#   off         Disable VRR
#   passthrough Leave VRR exactly as it is
#
# Default if omitted: passthrough
# -----------------------------------------------------------------------
ENTRY_VRR="on"


# -----------------------------------------------------------------------
# EXIT_HDR — HDR state to apply when the app closes
#
#   on          Enable HDR on exit
#   off         Disable HDR on exit
#   restore     Restore to whatever state was active before launch
#
# Default if omitted: restore
# -----------------------------------------------------------------------
EXIT_HDR="restore"


# -----------------------------------------------------------------------
# EXIT_VRR — Adaptive Sync state when the app closes
#
#   on          Enable VRR on exit
#   off         Disable VRR on exit
#   restore     Restore to whatever state was active before launch
#
# Default if omitted: restore
# -----------------------------------------------------------------------
EXIT_VRR="restore"


# -----------------------------------------------------------------------
# COMMAND — Launch command for standalone apps (no %command% passed in)
#
# Only needed when NOT using Steam/Heroic launch options.
# Supports environment variables and quoted arguments.
#
# Examples:
#   COMMAND="mpv --fullscreen /home/user/movie.mkv"
#   COMMAND="/usr/bin/vlc"
#
# For Steam/Heroic, leave this unset — %command% is used instead.
# -----------------------------------------------------------------------
# COMMAND="/usr/bin/myapp"
